services:
  planning-backend:
    container_name: planning-backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build: ./backend
    env_file:
      - ./backend/prod.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/javadhelali/.ssh/id_ed25519:/keys/id_ed25519:ro
    networks:
      - apps

  planning-frontend:
    container_name: planning-frontend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.questboard.ir
    networks:
      - apps
  
  planning-redis:
    container_name: planning-redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:latest
    ports:
      - "127.0.0.1:6032:6379"
    networks:
      - apps

  planning-db:
    container_name: planning-db
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=7NB05789o7uytOI
    ports:
      - "127.0.0.1:5498:5432"
    volumes:
      - /app/docker/planning-postgres:/var/lib/postgresql/data
    networks:
      - apps

  planning-db-backup:
    container_name: planning-db-backup
    image: prodrigestivill/postgres-backup-local
    restart: always
    environment:
      - SCHEDULE=@daily
      - POSTGRES_HOST=planning-db
      - POSTGRES_DB=planning
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=7NB05789o7uytOI
      - POSTGRES_EXTRA_OPTS=--clean --if-exists -Z1
      - BACKUP_KEEP_DAYS=3
      - BACKUP_KEEP_WEEKS=1
      - BACKUP_KEEP_MONTHS=1
    volumes:
      - /app/backups/planning-postgres:/backups
    depends_on:
      - planning-db
    networks:
      - apps

networks:
  apps:
    external: true
